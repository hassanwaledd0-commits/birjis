# Birjis: static site. Package = index.html, vendor/ (three.js r128 + IBM Plex fonts), logo.png, og.png, sitemap.xml, robots.txt (made by tools/mksite.py).
# Netlify compresses text files (gzip/brotli) by itself; nothing to configure for that.
# Drag-and-drop deploys read _headers; a Git or CLI deploy reads this file. The two files carry the same rules.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "SAMEORIGIN"

# the page changes with every release: revalidate every time (a 304 costs almost nothing)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# three.js and the fonts: the file name carries the version, so a new version means a new name
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# URLs of earlier packages keep working: they now open the current page
[[redirects]]
  from = "/birjis.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/loader.html"
  to = "/"
  status = 301
